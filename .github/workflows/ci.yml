
name: DevOps Assignment 2 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required portfolio files
        run: |
          test -f index.html
          test -f style.css
          test -f Dockerfile

      - name: Validate HTML and roll number
        run: |
          grep -qi '<title>' index.html
          grep -q 'FA23-BAI-066' index.html
          grep -q 'GitHub Actions' index.html

      - name: Check all required Labs topics
        run: |
          grep -q 'Git:' index.html
          grep -q 'GitHub:' index.html
          grep -q 'Docker:' index.html
          grep -q 'GitHub Actions:' index.html

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: aimakhaan/devops-a2:latest
